<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OpenAgent 审计台{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --surface: #fff; --surface-2: #f0f2f5; --line: #e2e5ea;
      --ink: #111827; --ink-2: #464f60; --ink-3: #6b7384;
      --accent: #2b4acb; --accent-soft: #eaeefc;
      --ok: #15803d; --risk: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0e13; --surface: #131820; --surface-2: #1a2029; --line: #252c38;
        --ink: #e8ebf1; --ink-2: #aeb6c4; --ink-3: #8b94a4;
        --accent: #8fa3ff; --accent-soft: rgba(143,163,255,.13);
        --ok: #4ade80; --risk: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font: 15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    header { display:flex; align-items:center; gap:20px; padding:14px 28px;
      background:var(--surface); border-bottom:1px solid var(--line); }
    header .brand { font-weight:700; letter-spacing:.01em; }
    header nav { display:flex; gap:4px; flex:1; }
    header nav a { color:var(--ink-2); text-decoration:none; padding:5px 12px; border-radius:8px; }
    header nav a:hover { background:var(--surface-2); color:var(--ink); }
    header form { margin:0; }
    .wrap { max-width:1080px; margin:32px auto; padding:0 24px; }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--ink-3); font-size:13.5px; margin:0 0 24px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:12px;
      padding:18px 22px; margin-bottom:16px; box-shadow:0 1px 2px rgba(17,24,39,.04); }
    table { border-collapse:collapse; width:100%; font-size:13.5px; }
    th,td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
    thead th { background:var(--surface-2); color:var(--ink-3); font-size:12px; }
    tbody tr:last-child td { border-bottom:none; }
    code,.mono { font-family:ui-monospace,Consolas,monospace; font-size:.9em; }
    .ent { background:var(--surface-2); color:var(--ink-2); border:1px dashed var(--ink-3);
      border-radius:5px; padding:1px 6px; font-family:ui-monospace,Consolas,monospace; font-size:.9em; }
    .msg { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 16px; line-height:2; }
    .pill { display:inline-block; padding:1px 9px; border-radius:999px; font-size:12px; font-weight:550; }
    .pill.b3 { background:var(--accent-soft); color:var(--accent); }
    .pill.ok { background:rgba(21,128,61,.12); color:var(--ok); }
    .pill.risk { background:rgba(180,35,24,.1); color:var(--risk); }
    .pill.mute { background:var(--surface-2); color:var(--ink-2); }
    button, .btn { font:inherit; font-size:13.5px; cursor:pointer; border-radius:8px;
      padding:5px 14px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.danger { background:transparent; border-color:var(--risk); color:var(--risk); }
    input, textarea, select { font:inherit; padding:6px 10px; border:1px solid var(--line);
      border-radius:8px; background:var(--surface); color:var(--ink); width:100%; }
    label { display:block; font-size:13px; color:var(--ink-3); margin:10px 0 4px; }
    .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    .row > div { flex:1; min-width:180px; }
    .login { max-width:420px; margin:12vh auto; }
    .error { color:var(--risk); font-size:13.5px; margin-top:8px; }
    .muted { color:var(--ink-3); font-size:12.5px; }
    pre { white-space:pre-wrap; word-break:break-all; }
    form.inline { display:inline; }
  </style>
</head>
<body>
<header>
  <span class="brand">OpenAgent 审计台</span>
  <nav>
    <a href="/ui/sessions">会话</a>
    <a href="/ui/requests">还原审批</a>
    <a href="/ui/audit-log">审计日志</a>
  </nav>
  {% if principal %}
  <span class="muted">{{ principal.username }} · {{ principal.role }}</span>
  <form action="/ui/logout" method="post"><button>退出</button></form>
  {% endif %}
</header>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
