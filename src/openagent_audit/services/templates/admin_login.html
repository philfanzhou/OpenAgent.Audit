{% extends "base.html" %}
{% block title %}管理员登录 · OpenAgent 审计台{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width:460px">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">管理员登录</h1>
    <p class="sub mb-3">
      当前会话：<strong>{{ session_user }}</strong><br>
      登录后可以点击脱敏内容查看原文。<strong>每次查看都会记录到审计日志</strong>，
      并注明是哪个账号在什么时间查看了哪一条。
    </p>
    <form action="/ui/admin/login" method="post">
      <label class="form-label mb-1 small" for="username">管理员账号</label>
      <input id="username" class="form-control" name="username" autocomplete="username" autofocus required>
      <label class="form-label mb-1 small mt-2" for="password">密码</label>
      <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" required>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary" type="submit">登录</button>
        <a class="btn btn-outline-secondary" href="/ui/sessions">返回</a>
      </div>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</div>
{% endblock %}
