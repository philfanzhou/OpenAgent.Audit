# Prometheus scrape config snippet for OpenAgent.Audit (dev compose stack).
# Merge into your prometheus.yml; rule_files -> deploy/alerting/audit-alerts.yml.
scrape_configs:
  - job_name: openagent-audit
    metrics_path: /internal/metrics/prometheus
    scrape_interval: 30s
    # Bearer token of a developer principal (the only role holding VIEW_METRICS).
    authorization:
      type: Bearer
      credentials: "set-a-metrics-token-here"
    static_configs:
      - targets: ["audit-api:8100"]

rule_files:
  - /etc/prometheus/audit-alerts.yml
