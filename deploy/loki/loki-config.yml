# Loki local dev config. Production: retention days-level, single binary is
# enough for alerting copies — the audit log's system of record is the
# append-only table + Object-Lock archive, never Loki (proposal §05).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Proposal §02 通路③: reject oversized lines early — long prompts must
  # never be routed here in the first place.
  max_line_size: 262144
