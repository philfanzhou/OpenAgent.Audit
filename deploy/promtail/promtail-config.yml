# Promtail configuration for the OpenAgent service logs that reach Loki as
# the alerting copy only (proposal §02 通路③ / §05).
#
# Verified against the real services, not assumed:
#
#   * OpenAgent logs through Serilog to **container stdout**. There is no
#     /var/log/openagent/*.log on the host, so a file-based scrape collects
#     nothing. This file discovers containers through the Docker socket.
#   * Serilog's default console template is PLAIN TEXT and renders neither
#     `Enrich.WithProperty` values (ServiceName, InstanceId) nor `BeginScope`
#     fields (TraceId, ConversationId, UserId, TenantId). Parsing that output
#     as JSON yields nothing.
#   * With Serilog:ConsoleFormat=Json (the setting the Engine and Router ship
#     in appsettings.json), each event is a single JSON object like:
#
#       {"Timestamp":"2026-11-05T10:48:20.50+08:00","Level":"Information",
#        "MessageTemplate":"LLM interaction recorded. ConversationId={ConversationId} ...",
#        "TraceId":"ea83bb32...","SpanId":"09842bda...",
#        "Properties":{"ConversationId":"conv-e2e-1","TraceId":"trace-e2e-1",
#                      "AgentId":"cs-bot","ServiceName":"agent-engine",
#                      "ServiceVersion":"1.0.0","InstanceId":"..."}}
#
#     Note that the correlation ids land in `Properties`, while the top-level
#     TraceId is the W3C Activity id — both are kept but under distinct names.
#
# Only low-cardinality service identity becomes a Loki label; everything else
# stays in structured metadata / the log line so the index does not blow up.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: openagent-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # OpenAgent's application services (deploy/openagent/docker-compose.yml).
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "^(engine|router|runner)$"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/+"
        replacement: ""
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - json:
          expressions:
            # top-level
            level: Level
            message_template: MessageTemplate
            activity_trace_id: TraceId      # W3C Activity id
            span_id: SpanId
            timestamp: Timestamp
            # Serilog Properties (Serilog:ConsoleFormat=Json)
            service_name: Properties.ServiceName
            service_version: Properties.ServiceVersion
            conversation_id: Properties.ConversationId
            agent_id: Properties.AgentId
            source_trace_id: Properties.TraceId   # business trace id (X-Trace-Id)

      # If a deployment still runs Plain output, `json` leaves every field
      # empty; fall back to the container's service label so the stream is
      # still labelled sensibly instead of being dropped.
      - template:
          source: service_name
          template: "{{ if .service_name }}{{ .service_name }}{{ else }}{{ .compose_service }}{{ end }}"
      - labels:
          service_name:
      - structured_metadata:
          # High-cardinality correlation ids stay queryable without becoming
          # index labels; Loki 3.x structured metadata keeps them cheap.
          level:
          conversation_id:
          agent_id:
          activity_trace_id:
          source_trace_id:
          span_id:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: skip
      - output:
          # drop extracted copies from the label set; the line is untouched
          source: ""

  # Optional: for deployments that deliberately also write container logs to
  # files (bind-mounted /var/log/openagent from a sidecar). It only reads
  # files that actually exist, and expects the same JSON format.
  # - job_name: openagent-files
  #   static_configs:
  #     - targets: [localhost]
  #       labels:
  #         __path__: /var/log/openagent/*.log
  #   pipeline_stages:
  #     - json:
  #         expressions:
  #           service_name: Properties.ServiceName
  #           conversation_id: Properties.ConversationId
  #           activity_trace_id: TraceId
  #     - labels:
  #         service_name: