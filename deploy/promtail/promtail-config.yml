# Scrapes service JSON logs; every line must carry trace_id/session_id as
# JSON fields (never as labels — proposal §02 通路③ cardinality warning).
server:
  http_listen_port: 9080

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: openagent-services
    static_configs:
      - targets: [localhost]
        labels:
          job: openagent-services
          __path__: /var/log/openagent/*.log
    pipeline_stages:
      - json:
          expressions:
            trace_id: trace_id
            session_id: session_id
      - output:
          source: ""
