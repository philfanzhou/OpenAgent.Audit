[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-audit"
version = "0.1.0"
description = "Audit and observability data plane for OpenAgent: masked traces, encrypted entity vault, hash-chained audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenAgent" }]
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "httpx>=0.27",
  # FastAPI raises while registering audit-web's Form() endpoints when this is
  # missing, so the entire audit-api app fails to build — it is a real
  # runtime dependency, not an optional convenience.
  "python-multipart>=0.0.9",
  # OIDC Authorization Code + PKCE login against the company SSO.
  "authlib>=1.3",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
langfuse = ["langfuse>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
# Masking Gateway OTLP/Protobuf ingest. The .NET OpenAgent platform exports
# http/protobuf by default, so the gateway needs this in any real deployment;
# JSON-only ingest works without it.
otlp = ["opentelemetry-proto>=1.24"]
presidio = ["presidio-analyzer>=2.2"]
dev = ["pytest>=8", "pytest-cov", "opentelemetry-proto>=1.24", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openagent_audit = ["services/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E9/F：语法错误与死代码（真正的 bug 级问题）；I：导入排序。
# 其余风格类规则（行长、Unicode 歧义、SIM/FURB/BLE）不启用：中文项目的
# RUF001-003 全角字符误报与边界层容错模式属于刻意设计。
select = ["E9", "F", "I", "RUF100", "W292"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# 冒烟脚本与演示数据：环境变量必须先于 openagent_audit 导入（刻意模式）
"scripts/smoke_e2e.py" = ["E402"]
"scripts/smoke_gateway_otlp.py" = ["E402"]
"src/openagent_audit/services/demo_seed.py" = ["E402"]
