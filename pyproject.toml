[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-audit"
version = "0.1.0"
description = "Audit and observability data plane for OpenAgent: masked traces, encrypted entity vault, hash-chained audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenAgent" }]
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "httpx>=0.27",
  # FastAPI raises while registering audit-web's Form() endpoints when this is
  # missing, so the entire audit-api app fails to build — it is a real
  # runtime dependency, not an optional convenience.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
langfuse = ["langfuse>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
# Masking Gateway OTLP/Protobuf ingest. The .NET OpenAgent platform exports
# http/protobuf by default, so the gateway needs this in any real deployment;
# JSON-only ingest works without it.
otlp = ["opentelemetry-proto>=1.24"]
presidio = ["presidio-analyzer>=2.2"]
dev = ["pytest>=8", "pytest-cov", "opentelemetry-proto>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openagent_audit = ["services/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
